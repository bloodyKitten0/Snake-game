
name: Snake Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Build and Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile tests
        run: |
          g++ -std=c++20 -Wall -Wextra -Wpedantic \
            game_logic.cpp tests.cpp \
            -o snake_tests

      - name: Run tests
        run: ./snake_tests
